name: Run NPM Audit Fix
on:
  workflow_dispatch:
    inputs:
      package_to_upgrade:
        description: 'Optional: Single package@latest to upgrade (leave blank for safe npm audit fix)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Audit Fix or Single Package Upgrade
        run: |
          if [ -n "${{ github.event.inputs.package_to_upgrade }}" ]; then
            npm install "${{ github.event.inputs.package_to_upgrade }}"
          else
            npm audit fix || true
          fi
          echo "=== Remaining Production-Only Vulnerabilities ==="
          npm audit --omit=dev || true

      - name: Verify Build & Tests
        id: verify
        continue-on-error: true
        run: npm run build && npm run test

      - name: Open PR with Lockfile Updates
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore(deps): security audit and dependency update'
          branch: chore/npm-audit-fix
          title: 'chore(deps): security audit and dependency update'
          body: |
            Automated dependency security patch.
            - Build & Test status: `${{ steps.verify.outcome }}`
