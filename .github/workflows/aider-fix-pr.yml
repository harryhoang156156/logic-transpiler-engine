name: Aider PR Fix Loop

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open Pull Request number (e.g., 14)'
        required: true
        type: string
      instructions:
        description: 'Paste CodeRabbit review comments or fix instructions'
        required: true
        type: string
      already_committed_fix_attempt:
        description: 'Check if another agent (e.g., CodeRabbit) already pushed an unverified fix commit'
        required: false
        default: false
        type: boolean
      overview_file:
        description: 'Global system overview / rules file path'
        required: false
        default: 'architecture_overview.md'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Existing PR Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Aider Cloud Agent"
          git config --global user.email "aider-bot@://github.com"
          gh pr checkout "${{ github.event.inputs.pr_number }}"

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          npm install
          pip install -q aider-chat

      - name: Run Aider Fix Loop (Multi-Provider Cascade + Checkpointing)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KILO_KEY: ${{ secrets.KILO_API_KEY }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          FIX_INSTRUCTIONS: ${{ github.event.inputs.instructions }}
          PRIOR_ATTEMPT: ${{ github.event.inputs.already_committed_fix_attempt }}
          OVERVIEW_FILE: ${{ github.event.inputs.overview_file }}
        run: |
          set -o pipefail

          CHECKPOINT_SHA=$(git rev-parse HEAD)

          EXTRA_CONTEXT=""
          if [ "$PRIOR_ATTEMPT" == "true" ]; then
            LAST_DIFF=$(git log -n 1 -p -- src/ tests/)
            EXTRA_CONTEXT="NOTE: Another automated review agent already pushed a tentative fix commit to this branch. Here is the diff of that recent commit:
          $LAST_DIFF

          Audit those changes carefully against the review feedback and $OVERVIEW_FILE. Keep what is valid, fix anything incomplete or broken, or rewrite it cleanly if needed."
          fi

          PROMPT="Review the existing code in src/ and tests/ against $OVERVIEW_FILE. Apply the following PR review fixes: $FIX_INSTRUCTIONS. $EXTRA_CONTEXT Preserve .js extensions on relative imports and update tests if needed. Loop until npm run build and npm run test pass."

          READ_FLAGS=()
          if [ -n "$OVERVIEW_FILE" ] && [ -f "$OVERVIEW_FILE" ]; then
            READ_FLAGS+=(--read "$OVERVIEW_FILE")
          fi

          CANDIDATES=(
            "openrouter|openrouter/free"
            "groq|groq/openai/gpt-oss-120b"
            "groq|groq/qwen/qwen3-32b"
            "kilo|openai/qwen/qwen3-coder:free"
            "kilo|openai/kilo-auto/free"
          )

          SUCCESS=false
          for ENTRY in "${CANDIDATES[@]}"; do
            PROVIDER="${ENTRY%%|*}"
            MODEL="${ENTRY#*|}"

            # Skip provider instantly if its secret key is not configured
            if [ "$PROVIDER" == "openrouter" ] && [ -z "$OPENROUTER_API_KEY" ]; then
              echo "Skipping [$PROVIDER] $MODEL (OPENROUTER_API_KEY not set)"
              continue
            fi
            if [ "$PROVIDER" == "groq" ] && [ -z "$GROQ_API_KEY" ]; then
              echo "Skipping [$PROVIDER] $MODEL (GROQ_API_KEY not set)"
              continue
            fi
            if [ "$PROVIDER" == "kilo" ] && [ -z "$KILO_KEY" ]; then
              echo "Skipping [$PROVIDER] $MODEL (KILO_API_KEY not set)"
              continue
            fi

            # Start cleanly from the latest verified checkpoint
            git reset --hard "$CHECKPOINT_SHA" >/dev/null
            git clean -f >/dev/null

            unset OPENAI_API_BASE
            unset OPENAI_API_KEY
            if [ "$PROVIDER" == "kilo" ]; then
              export OPENAI_API_BASE="https://kilo.ai"
              export OPENAI_API_KEY="$KILO_KEY"
            fi

            echo "=================================================="
            echo "Attempting Aider [$PROVIDER] -> $MODEL"
            echo "=================================================="

            aider \
              --model "$MODEL" \
              --edit-format whole \
              --no-show-model-warnings \
              --no-stream \
              --yes \
              --auto-commits \
              "${READ_FLAGS[@]}" \
              --test-cmd "npm run build && npm run test" \
              --auto-test \
              --message "$PROMPT" \
              2>&1 | tee /tmp/aider.log || true

            if grep -qiE "rate limited|RateLimitError|429 Too Many Requests|Request too large|413|NotFoundError|model_not_found|AuthenticationError|401|API key.*not found|without an .* API key|No .* API key|Missing API key|ContextWindowExceededError|ServiceUnavailableError|503" /tmp/aider.log; then
              # Discard any uncommitted half-edits, then inspect any new commits made before the error
              git reset --hard HEAD >/dev/null
              git clean -f >/dev/null
              NEW_SHA=$(git rev-parse HEAD)

              if [ "$NEW_SHA" != "$CHECKPOINT_SHA" ] && npm run build >/dev/null 2>&1 && npm run test >/dev/null 2>&1; then
                echo "::notice::[$PROVIDER] $MODEL hit a rate limit, but left a passing build & test checkpoint ($NEW_SHA). Keeping progress!"
                CHECKPOINT_SHA="$NEW_SHA"
              else
                echo "::warning::[$PROVIDER] $MODEL hit a rate limit with unverified changes. Rolling back to checkpoint $CHECKPOINT_SHA..."
                git reset --hard "$CHECKPOINT_SHA" >/dev/null
                git clean -f >/dev/null
              fi
              sleep 10
            else
              echo "Successfully completed Aider loop via [$PROVIDER] $MODEL"
              SUCCESS=true
              break
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            git reset --hard "$CHECKPOINT_SHA" >/dev/null
            git clean -f >/dev/null
            echo "::error::All provider tiers hit rate/token limits or failed. Wait a few minutes and re-run."
            exit 1
          fi

      - name: Verify & Push Fixes to PR
        run: |
          npm run build
          npm run test
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: address PR review feedback"
          fi
          git fetch origin
          if ! git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"; then
            echo "::warning::Rebase conflict with remote PR commit; keeping Aider's verified version."
            git rebase --abort || true
            git push --force-with-lease origin HEAD
            exit 0
          fi
          npm run build
          npm run test
          git push origin HEAD
