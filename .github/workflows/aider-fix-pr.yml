name: Aider PR Fix Loop

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open Pull Request number (e.g., 14)'
        required: true
        type: string
      instructions:
        description: 'Paste CodeRabbit review comments or fix instructions'
        required: true
        type: string
      already_committed_fix_attempt:
        description: 'Check if another agent (e.g., CodeRabbit) already pushed an unverified fix commit'
        required: false
        default: false
        type: boolean
      overview_file:
        description: 'Global system overview / rules file path'
        required: false
        default: 'architecture_overview.md'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Existing PR Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Aider Cloud Agent"
          git config --global user.email "aider-bot@://github.com"
          gh pr checkout "${{ github.event.inputs.pr_number }}"

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          npm install
          pip install -q aider-chat

      - name: Run Aider Fix Loop (Idle-Guarded Multi-Key Cascade)
        env:
          GOOGLE_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OR_KEY_1: ${{ secrets.OPENROUTER_API_KEY }}
          OR_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OR_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          KILO_KEY: ${{ secrets.KILO_API_KEY }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          LITELLM_NUM_RETRIES: '1'
          FIX_INSTRUCTIONS: ${{ github.event.inputs.instructions }}
          PRIOR_ATTEMPT: ${{ github.event.inputs.already_committed_fix_attempt }}
          OVERVIEW_FILE: ${{ github.event.inputs.overview_file }}
        run: |
          set -o pipefail

          INITIAL_SHA=$(git rev-parse HEAD)
          CHECKPOINT_SHA="$INITIAL_SHA"

          TARGET_FILES=()
          shopt -s globstar nullglob
          for f in src/**/*.ts tests/**/*.ts; do
            if [ -f "$f" ] && echo "$FIX_INSTRUCTIONS" | grep -qF "$f"; then
              TARGET_FILES+=("$f")
            fi
          done
          shopt -u globstar nullglob

          if [ ${#TARGET_FILES[@]} -eq 0 ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && [ -f "$f" ] && TARGET_FILES+=("$f")
            done < <(git diff --name-only main...HEAD -- src/ tests/)
          fi

          READ_FLAGS=()
          [ -n "$OVERVIEW_FILE" ] && [ -f "$OVERVIEW_FILE" ] && READ_FLAGS+=(--read "$OVERVIEW_FILE")
          [ -f "dependencies_and_connections.md" ] && READ_FLAGS+=(--read "dependencies_and_connections.md")

          CANDIDATES=(
            "google|gemini/gemini-3.8-flash"
            "openrouter1|openrouter/particle-ai/particle-1:free"
            "openrouter2|openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
            "openrouter3|openrouter/particle-ai/particle-1:free"
            "google|gemini/gemini-3.5-flash-lite"
            "kilo|openai/kilo-auto/free"
          )

          run_with_idle_timeout() {
            local idle_limit=300
            "$@" > /tmp/aider_raw.log 2>&1 &
            local pid=$!
            local last_size=0
            local idle_secs=0
            while kill -0 "$pid" 2>/dev/null; do
              sleep 5
              local cur_size=$(wc -c < /tmp/aider_raw.log 2>/dev/null || echo 0)
              if [ "$cur_size" -gt "$last_size" ]; then
                last_size=$cur_size
                idle_secs=0
              else
                idle_secs=$((idle_secs + 5))
                if [ "$idle_secs" -ge "$idle_limit" ]; then
                  echo "::warning::Aider stalled with no output for ${idle_limit}s. Killing stalled process..."
                  kill -9 "$pid" 2>/dev/null || true
                  break
                fi
              fi
            done
            wait "$pid" 2>/dev/null || true
            sed -e '/<!DOCTYPE/I,/<\/html>/Id' -e '/<html/I,/<\/html>/Id' /tmp/aider_raw.log
          }

          SUCCESS=false
          for ENTRY in "${CANDIDATES[@]}"; do
            PROVIDER="${ENTRY%%|*}"
            MODEL="${ENTRY#*|}"

            unset GEMINI_API_KEY OPENROUTER_API_KEY OPENAI_API_BASE OPENAI_API_KEY

            case "$PROVIDER" in
              google)
                [ -z "$GOOGLE_KEY" ] && continue
                export GEMINI_API_KEY="$GOOGLE_KEY"
                ;;
              openrouter1)
                [ -z "$OR_KEY_1" ] && continue
                export OPENROUTER_API_KEY="$OR_KEY_1"
                ;;
              openrouter2)
                [ -z "$OR_KEY_2" ] && continue
                export OPENROUTER_API_KEY="$OR_KEY_2"
                ;;
              openrouter3)
                [ -z "$OR_KEY_3" ] && continue
                export OPENROUTER_API_KEY="$OR_KEY_3"
                ;;
              kilo)
                [ -z "$KILO_KEY" ] && continue
                export OPENAI_API_BASE="https://kilo.ai"
                export OPENAI_API_KEY="$KILO_KEY"
                ;;
            esac

            git reset --hard "$CHECKPOINT_SHA" >/dev/null
            git clean -f >/dev/null

            PROMPT="IMPORTANT: $OVERVIEW_FILE and dependencies_and_connections.md are READ-ONLY reference documents—do NOT edit them. Edit ONLY the target files loaded in chat (${TARGET_FILES[*]}) to apply these fixes: $FIX_INSTRUCTIONS. Preserve .js extensions on relative imports and update tests if needed. Loop until npm run build and npm run test pass."

            echo "=================================================="
            echo "Attempting Aider [$PROVIDER] -> $MODEL (Files: ${TARGET_FILES[*]})"
            echo "=================================================="

            run_with_idle_timeout aider \
              --model "$MODEL" \
              --edit-format whole \
              --map-tokens 1024 \
              --chat-history-file /tmp/aider-fix-history.md \
              --no-detect-urls \
              --no-show-model-warnings \
              --yes \
              --auto-commits \
              "${READ_FLAGS[@]}" \
              "${TARGET_FILES[@]}" \
              --test-cmd "npm run build && npm run test" \
              --auto-test \
              --message "$PROMPT" || true

            HAS_CHANGES=false
            if [ "$(git rev-parse HEAD)" != "$CHECKPOINT_SHA" ] || ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              HAS_CHANGES=true
            fi

            if [ "$HAS_CHANGES" == "true" ]; then
              if npm run build >/dev/null 2>&1 && npm run test >/dev/null 2>&1; then
                git add -A
                if ! git diff --cached --quiet; then
                  git commit -m "chore: checkpoint passing PR fixes" >/dev/null
                fi
                CHECKPOINT_SHA=$(git rev-parse HEAD)
                echo "Successfully completed Aider fix loop via [$PROVIDER] $MODEL"
                SUCCESS=true
                break
              else
                echo "::warning::[$PROVIDER] $MODEL left broken build or failing tests. Rolling back to ${CHECKPOINT_SHA:0:7}..."
                git reset --hard "$CHECKPOINT_SHA" >/dev/null
                git clean -f >/dev/null
              fi
            else
              echo "::warning::[$PROVIDER] $MODEL made no file changes (rate-limited or stalled)."
            fi
            sleep 2
          done

          if [ "$SUCCESS" != "true" ]; then
            git reset --hard "$CHECKPOINT_SHA" >/dev/null
            git clean -f >/dev/null
            echo "::error::All provider keys hit rate limits or failed. Wait for quota reset and re-run."
            exit 1
          fi

      - name: Verify & Push Fixes to PR
        run: |
          npm run build
          npm run test
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: address PR review feedback"
          fi
          git fetch origin
          if ! git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"; then
            echo "::warning::Rebase conflict with remote PR commit; keeping Aider's verified version."
            git rebase --abort || true
            git push --force-with-lease origin HEAD
            exit 0
          fi
          npm run build
          npm run test
          git push origin HEAD
