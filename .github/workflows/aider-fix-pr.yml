name: Aider PR Fix Loop

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open Pull Request number (e.g., 14)'
        required: true
        type: string
      instructions:
        description: 'Paste CodeRabbit review comments or fix instructions'
        required: true
        type: string
      already_committed_fix_attempt:
        description: 'Check if another agent (e.g., CodeRabbit) already pushed an unverified fix commit'
        required: false
        default: false
        type: boolean
      overview_file:
        description: 'Global system overview / rules file path'
        required: false
        default: 'architecture_overview.md'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Existing PR Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Aider Cloud Agent"
          git config --global user.email "aider-bot@://github.com"
          gh pr checkout "${{ github.event.inputs.pr_number }}"

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          npm install
          pip install -q aider-chat

      - name: Run Aider Fix Loop (Google -> 3x OpenRouter -> Kilo)
        env:
          GOOGLE_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OR_KEY_1: ${{ secrets.OPENROUTER_API_KEY }}
          OR_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OR_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          KILO_KEY: ${{ secrets.KILO_API_KEY }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          LITELLM_NUM_RETRIES: '1'
          FIX_INSTRUCTIONS: ${{ github.event.inputs.instructions }}
          PRIOR_ATTEMPT: ${{ github.event.inputs.already_committed_fix_attempt }}
          OVERVIEW_FILE: ${{ github.event.inputs.overview_file }}
        run: |
          set -o pipefail

          INITIAL_SHA=$(git rev-parse HEAD)
          CHECKPOINT_SHA="$INITIAL_SHA"

          EXTRA_CONTEXT=""
          if [ "$PRIOR_ATTEMPT" == "true" ]; then
            LAST_DIFF=$(git log -n 1 -p -- src/ tests/)
            EXTRA_CONTEXT=$(printf "NOTE: Another automated review agent already pushed a tentative fix commit to this branch. Here is the diff of that recent commit:\n%s\n\nAudit those changes carefully against the review feedback and %s. Keep what is valid, fix anything incomplete or broken, or rewrite it cleanly if needed." "$LAST_DIFF" "$OVERVIEW_FILE")
          fi

          PR_FILES=()
          while IFS= read -r f; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              PR_FILES+=("$f")
            fi
          done < <(git diff --name-only main...HEAD -- src/ tests/)

          READ_FLAGS=()
          if [ -n "$OVERVIEW_FILE" ] && [ -f "$OVERVIEW_FILE" ]; then
            READ_FLAGS+=(--read "$OVERVIEW_FILE")
          fi
          if [ -f "dependencies_and_connections.md" ]; then
            READ_FLAGS+=(--read "dependencies_and_connections.md")
          fi
          if [ -f "src/schemas.ts" ]; then
            READ_FLAGS+=(--read "src/schemas.ts")
          fi

          CANDIDATES=(
            "google|gemini/gemini-3.8-flash"
            "google|gemini/gemini-3.5-flash-lite"
            "google|gemini/gemma-4-31b-it"
            "openrouter1|openrouter/particle-ai/particle-1:free"
            "openrouter1|openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
            "openrouter1|openrouter/nvidia/nemotron-3.5-super-vl:free"
            "openrouter1|openrouter/baidu/ernie-5.5-flash-preview:free"
            "openrouter2|openrouter/particle-ai/particle-1:free"
            "openrouter2|openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
            "openrouter2|openrouter/nvidia/nemotron-3.5-super-vl:free"
            "openrouter2|openrouter/baidu/ernie-5.5-flash-preview:free"
            "openrouter3|openrouter/particle-ai/particle-1:free"
            "openrouter3|openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
            "openrouter3|openrouter/nvidia/nemotron-3.5-super-vl:free"
            "openrouter3|openrouter/baidu/ernie-5.5-flash-preview:free"
            "kilo|openai/kilo-auto/free"
          )

          SUCCESS=false
          for ENTRY in "${CANDIDATES[@]}"; do
            PROVIDER="${ENTRY%%|*}"
            MODEL="${ENTRY#*|}"

            unset GEMINI_API_KEY OPENROUTER_API_KEY OPENAI_API_BASE OPENAI_API_KEY

            case "$PROVIDER" in
              google)
                [ -z "$GOOGLE_KEY" ] && continue
                export GEMINI_API_KEY="$GOOGLE_KEY"
                ;;
              openrouter1)
                [ -z "$OR_KEY_1" ] && continue
                export OPENROUTER_API_KEY="$OR_KEY_1"
                ;;
              openrouter2)
                [ -z "$OR_KEY_2" ] && continue
                export OPENROUTER_API_KEY="$OR_KEY_2"
                ;;
              openrouter3)
                [ -z "$OR_KEY_3" ] && continue
                export OPENROUTER_API_KEY="$OR_KEY_3"
                ;;
              kilo)
                [ -z "$KILO_KEY" ] && continue
                export OPENAI_API_BASE="https://kilo.ai"
                export OPENAI_API_KEY="$KILO_KEY"
                ;;
            esac

            git reset --hard "$CHECKPOINT_SHA" >/dev/null
            git clean -f >/dev/null

            RESUME_NOTE=""
            if [ "$CHECKPOINT_SHA" != "$INITIAL_SHA" ]; then
              RESUME_NOTE="PROGRESS CHECKPOINT LOADED: A previous model already applied partial fixes that compile cleanly. Inspect the current files in chat and finish any remaining fix items or failing Vitest tests without undoing valid fixes."
            fi

            PROMPT="IMPORTANT: The files loaded as read-only ($OVERVIEW_FILE, dependencies_and_connections.md, src/schemas.ts) are strictly REFERENCE DOCUMENTS—do NOT edit them unless explicitly requested below. $RESUME_NOTE Edit ONLY the PR target files already loaded in chat (${PR_FILES[*]}) to apply these fixes: $FIX_INSTRUCTIONS. $EXTRA_CONTEXT Preserve .js extensions on relative imports and update tests if needed. Loop until npm run build and npm run test pass."

            echo "=================================================="
            echo "Attempting Aider [$PROVIDER] -> $MODEL (Checkpoint: ${CHECKPOINT_SHA:0:7})"
            echo "=================================================="

            timeout 6m aider \
              --model "$MODEL" \
              --edit-format whole \
              --map-tokens 1024 \
              --no-detect-urls \
              --no-show-model-warnings \
              --yes \
              --auto-commits \
              "${READ_FLAGS[@]}" \
              "${PR_FILES[@]}" \
              --test-cmd "npm run build && npm run test" \
              --auto-test \
              --message "$PROMPT" \
              2>&1 | tee /tmp/aider.log | grep -viE "<(!DOCTYPE|html|head|body|script|style|svg|path|div|span|meta|link)" || true

            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: checkpoint aider progress" >/dev/null
            fi
            NEW_SHA=$(git rev-parse HEAD)

            if [ "$NEW_SHA" != "$CHECKPOINT_SHA" ] \
               && npm run build >/dev/null 2>&1 \
               && npm run test >/dev/null 2>&1; then
              echo "Successfully completed Aider fix loop via [$PROVIDER] $MODEL"
              SUCCESS=true
              break
            fi

            SAVED_TIER2=false
            if [ "$NEW_SHA" != "$CHECKPOINT_SHA" ]; then
              for COMMIT in $(git rev-list "${CHECKPOINT_SHA}..${NEW_SHA}"); do
                git reset --hard "$COMMIT" >/dev/null
                git clean -f >/dev/null
                if npm run build >/dev/null 2>&1 && npm run test >/dev/null 2>&1; then
                  echo "::notice::[$PROVIDER] $MODEL salvaged full passing checkpoint ($COMMIT)!"
                  CHECKPOINT_SHA="$COMMIT"
                  SAVED_TIER2=true
                  SUCCESS=true
                  break
                fi
              done

              if [ "$SUCCESS" == "true" ]; then
                break
              fi

              for COMMIT in $(git rev-list "${CHECKPOINT_SHA}..${NEW_SHA}"); do
                git reset --hard "$COMMIT" >/dev/null
                git clean -f >/dev/null
                if npm run build >/dev/null 2>&1; then
                  echo "::notice::[$PROVIDER] $MODEL saved TypeScript-compiling checkpoint (${COMMIT:0:7}) for next model to finish tests!"
                  CHECKPOINT_SHA="$COMMIT"
                  SAVED_TIER2=true
                  break
                fi
              done
            fi

            if [ "$SAVED_TIER2" != "true" ]; then
              echo "::warning::[$PROVIDER] $MODEL failed, timed out, or left broken TypeScript. Rolling back to ${CHECKPOINT_SHA:0:7}..."
              git reset --hard "$CHECKPOINT_SHA" >/dev/null
              git clean -f >/dev/null
            fi
            sleep 3
          done

          if [ "$SUCCESS" != "true" ]; then
            git reset --hard "$CHECKPOINT_SHA" >/dev/null
            git clean -f >/dev/null
            echo "::error::All provider keys hit rate limits or failed. Wait a few minutes and re-run."
            exit 1
          fi

      - name: Verify & Push Fixes to PR
        run: |
          npm run build
          npm run test
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: address PR review feedback"
          fi
          git fetch origin
          if ! git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"; then
            echo "::warning::Rebase conflict with remote PR commit; keeping Aider's verified version."
            git rebase --abort || true
            git push --force-with-lease origin HEAD
            exit 0
          fi
          npm run build
          npm run test
          git push origin HEAD
