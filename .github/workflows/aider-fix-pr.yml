name: Aider PR Fix Loop

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open Pull Request number (e.g., 14)'
        required: true
        type: string
      instructions:
        description: 'Paste CodeRabbit review comments or fix instructions'
        required: true
        type: string
      already_committed_fix_attempt:
        description: 'Check if another agent (e.g., CodeRabbit) already pushed an unverified fix commit'
        required: false
        default: false
        type: boolean
      overview_file:
        description: 'Global system overview / rules file path'
        required: false
        default: 'architecture_overview.md'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Existing PR Branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Aider Cloud Agent"
          git config --global user.email "aider-bot@://github.com"
          gh pr checkout "${{ github.event.inputs.pr_number }}"

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          npm install
          pip install -q aider-chat

      - name: Run Aider Fix Loop (Live Auto-Discovery Cascade)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KILO_KEY: ${{ secrets.KILO_API_KEY }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          FIX_INSTRUCTIONS: ${{ github.event.inputs.instructions }}
          PRIOR_ATTEMPT: ${{ github.event.inputs.already_committed_fix_attempt }}
          OVERVIEW_FILE: ${{ github.event.inputs.overview_file }}
        run: |
          set -o pipefail

          CHECKPOINT_SHA=$(git rev-parse HEAD)

          EXTRA_CONTEXT=""
          if [ "$PRIOR_ATTEMPT" == "true" ]; then
            LAST_DIFF=$(git log -n 1 -p -- src/ tests/)
            EXTRA_CONTEXT=$(printf "NOTE: Another automated review agent already pushed a tentative fix commit to this branch. Here is the diff of that recent commit:\n%s\n\nAudit those changes carefully against the review feedback and %s. Keep what is valid, fix anything incomplete or broken, or rewrite it cleanly if needed." "$LAST_DIFF" "$OVERVIEW_FILE")
          fi

          PROMPT="Review the existing code in src/ and tests/ against $OVERVIEW_FILE. Apply the following PR review fixes: $FIX_INSTRUCTIONS. $EXTRA_CONTEXT Preserve .js extensions on relative imports and update tests if needed. Loop until npm run build and npm run test pass."

          READ_FLAGS=()
          if [ -n "$OVERVIEW_FILE" ] && [ -f "$OVERVIEW_FILE" ]; then
            READ_FLAGS+=(--read "$OVERVIEW_FILE")
          fi

          # Dynamically fetch live :free coding models from OpenRouter & Kilo so slugs never go 404
          mapfile -t CANDIDATES < <(python3 -c '
          import os, urllib.request, json

          def fetch_free(url, headers, prefix, fallback):
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode()).get("data", [])
                  preferred = ("code", "deepseek", "qwen", "glm", "nemotron", "particle", "dots", "ling")
                  scored = []
                  for m in data:
                      mid = m.get("id", "")
                      pricing = m.get("pricing") or {}
                      is_free = mid.endswith(":free") or (str(pricing.get("prompt")) == "0" and str(pricing.get("completion")) == "0")
                      if is_free and "image" not in mid and "audio" not in mid and "guard" not in mid and mid != "openrouter/free":
                          score = 0 if any(k in mid.lower() for k in preferred) else 1
                          scored.append((score, mid))
                  scored.sort()
                  picks = [f"{prefix}|{mid}" for _, mid in scored[:4]]
                  return picks if picks else fallback
              except Exception:
                  return fallback

          out = []
          if os.environ.get("OPENROUTER_API_KEY"):
              out.extend(fetch_free(
                  "https://openrouter.ai",
                  {"Authorization": "Bearer " + os.environ["OPENROUTER_API_KEY"]},
                  "openrouter",
                  ["openrouter|openrouter/cohere/north-mini-code:free", "openrouter|openrouter/nvidia/nemotron-3-ultra:free"]
              ))
              out = [x.replace("openrouter|", "openrouter|openrouter/") if not x.startswith("openrouter|openrouter/") else x for x in out]

          if os.environ.get("GROQ_API_KEY"):
              out.extend([
                  "groq|groq/qwen/qwen3.8-27b",
                  "groq|groq/openai/gpt-oss-120b",
                  "groq|groq/openai/gpt-oss-20b"
              ])

          if os.environ.get("KILO_KEY"):
              kilo_picks = fetch_free(
                  "https://kilo.ai",
                  {"Authorization": "Bearer " + os.environ["KILO_KEY"]},
                  "kilo",
                  ["kilo|openai/kilo-auto/free"]
              )
              kilo_picks = [x.replace("kilo|", "kilo|openai/") if not x.startswith("kilo|openai/") else x for x in kilo_picks]
              if "kilo|openai/kilo-auto/free" not in kilo_picks:
                  kilo_picks.append("kilo|openai/kilo-auto/free")
              out.extend(kilo_picks)

          for item in out:
              print(item)
          ')

          echo "Discovered live model cascade:"
          printf '  - %s\n' "${CANDIDATES[@]}"

          SUCCESS=false
          for PASS in 1 2; do
            if [ "$PASS" -eq 2 ]; then
              echo "::notice::Pass 1 hit provider burst limits. Waiting 65s for per-minute rate limit buckets to reset before Pass 2..."
              sleep 65
            fi

            for ENTRY in "${CANDIDATES[@]}"; do
              PROVIDER="${ENTRY%%|*}"
              MODEL="${ENTRY#*|}"

              git reset --hard "$CHECKPOINT_SHA" >/dev/null
              git clean -f >/dev/null

              unset OPENAI_API_BASE
              unset OPENAI_API_KEY
              if [ "$PROVIDER" == "kilo" ]; then
                export OPENAI_API_BASE="https://kilo.ai"
                export OPENAI_API_KEY="$KILO_KEY"
              fi

              echo "=================================================="
              echo "[Pass $PASS] Attempting Aider [$PROVIDER] -> $MODEL"
              echo "=================================================="

              aider \
                --model "$MODEL" \
                --edit-format whole \
                --no-show-model-warnings \
                --no-stream \
                --yes \
                --auto-commits \
                "${READ_FLAGS[@]}" \
                --test-cmd "npm run build && npm run test" \
                --auto-test \
                --message "$PROMPT" \
                2>&1 | tee /tmp/aider.log || true

              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "chore: checkpoint aider progress" >/dev/null
              fi
              NEW_SHA=$(git rev-parse HEAD)

              if ! grep -qiE "rate limited|RateLimitError|429 Too Many Requests|Request too large|413|NotFoundError|model_not_found|No endpoints available|AuthenticationError|401|API key.*not found|without an .* API key|No .* API key|Missing API key|ContextWindowExceededError|ServiceUnavailableError|503|APIConnectionError|InternalServerError|Timeout" /tmp/aider.log \
                 && npm run build >/dev/null 2>&1 \
                 && npm run test >/dev/null 2>&1; then
                echo "Successfully completed Aider fix loop via [$PROVIDER] $MODEL"
                SUCCESS=true
                break
              fi

              if [ "$NEW_SHA" != "$CHECKPOINT_SHA" ] && npm run build >/dev/null 2>&1 && npm run test >/dev/null 2>&1; then
                echo "::notice::[$PROVIDER] $MODEL stopped early, but left a passing build & test checkpoint ($NEW_SHA). Keeping progress!"
                CHECKPOINT_SHA="$NEW_SHA"
              else
                echo "::warning::[$PROVIDER] $MODEL failed, hit rate limits, or left incomplete code. Rolling back to $CHECKPOINT_SHA..."
                git reset --hard "$CHECKPOINT_SHA" >/dev/null
                git clean -f >/dev/null
              fi
              sleep 10
            done

            if [ "$SUCCESS" == "true" ]; then
              break
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            git reset --hard "$CHECKPOINT_SHA" >/dev/null
            git clean -f >/dev/null
            echo "::error::All provider tiers hit rate/token limits or failed across both passes. Wait a few minutes and re-run."
            exit 1
          fi

      - name: Verify & Push Fixes to PR
        run: |
          npm run build
          npm run test
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: address PR review feedback"
          fi
          git fetch origin
          if ! git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)"; then
            echo "::warning::Rebase conflict with remote PR commit; keeping Aider's verified version."
            git rebase --abort || true
            git push --force-with-lease origin HEAD
            exit 0
          fi
          npm run build
          npm run test
          git push origin HEAD
