name: CI Verify Main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps --no-progress
      - run: npm run build && npm run test
      - name: CLI Bundle Smoke Test
        run: node dist/main.js --help || true

