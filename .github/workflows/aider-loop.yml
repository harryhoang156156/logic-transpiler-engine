name: Autonomous Aider TDD Loop

on:
  workflow_dispatch:
    inputs:
      spec_file:
        description: 'Target component specification file path (e.g., specs/schemas.md)'
        required: true
        type: string
      overview_file:
        description: 'Global system overview / rules file path'
        required: false
        default: 'architecture_overview.md'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          npm install
          pip install -q aider-chat

      - name: Create Feature Branch
        run: |
          git config --global user.name "Aider Cloud Agent"
          git config --global user.email "aider-bot@users.noreply.github.com"
          BRANCH_NAME="aider/$(basename ${{ github.event.inputs.spec_file }} .md)-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run Aider Self-Healing Loop
        env:
          OPENAI_API_BASE: https://api.kilo.ai/api/gateway
          OPENAI_API_KEY: ${{ secrets.KILO_API_KEY }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          aider \
            --model openai/kilo-auto/free \
            --edit-format whole \
            --no-show-model-warnings \
            --no-stream \
            --yes \
            --auto-commits \
            --read "${{ github.event.inputs.overview_file }}" \
            --read "${{ github.event.inputs.spec_file }}" \
            --test-cmd "npm run build && npm run test" \
            --auto-test \
            --message "Read ${{ github.event.inputs.overview_file }} and ${{ github.event.inputs.spec_file }}. Create the target TypeScript file in src/ and its Vitest suite in tests/ (importing from 'vitest'). Use .js extensions on relative imports (e.g. '../schemas.js'). Loop until npm run build and npm run test pass."

      - name: Verify & Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npm run test
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: implement $(basename ${{ github.event.inputs.spec_file }} .md)"
          fi
          if [ -z "$(git diff --name-only main HEAD -- src/ tests/)" ]; then
            echo "Error: No files created in src/ or tests/." && exit 1
          fi
          git push -u origin "$BRANCH_NAME"
          gh pr create \
            --title "feat: implement $(basename ${{ github.event.inputs.spec_file }} .md)" \
            --body "Automated TDD implementation of \`${{ github.event.inputs.spec_file }}\`." \
            --base main \
            --head "$BRANCH_NAME"
