name: Autonomous Aider TDD Loop

on:
  workflow_dispatch:
    inputs:
      spec_file:
        description: 'Target component specification file path (e.g., specs/schemas.md)'
        required: true
        type: string
      overview_file:
        description: 'Global system overview / rules file path'
        required: false
        default: 'architecture_overview.md'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          npm install
          pip install -q aider-chat

      - name: Create Feature Branch
        run: |
          git config --global user.name "Aider Cloud Agent"
          git config --global user.email "aider-bot@users.noreply.github.com"
          BRANCH_NAME="aider/$(basename ${{ github.event.inputs.spec_file }} .md)-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run Aider Self-Healing Loop (Google -> 3x OpenRouter -> Kilo)
        env:
          GOOGLE_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OR_KEY_1: ${{ secrets.OPENROUTER_API_KEY }}
          OR_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OR_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          KILO_KEY: ${{ secrets.KILO_API_KEY }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          LITELLM_NUM_RETRIES: '1'
          OVERVIEW_FILE: ${{ github.event.inputs.overview_file }}
          SPEC_FILE: ${{ github.event.inputs.spec_file }}
        run: |
          set -o pipefail

          CHECKPOINT_SHA=$(git rev-parse HEAD)

          shopt -s globstar nullglob
          READ_FLAGS=(--read "$SPEC_FILE")
          if [ -n "$OVERVIEW_FILE" ] && [ -f "$OVERVIEW_FILE" ]; then
            READ_FLAGS+=(--read "$OVERVIEW_FILE")
          fi
          if [ -f "dependencies_and_connections.md" ]; then
            READ_FLAGS+=(--read "dependencies_and_connections.md")
          fi

          EDIT_FILES=()
          if [[ "$SPEC_FILE" == *integration* ]]; then
            # Integration mode: load existing src/ files so Aider wires them together and writes tests/integration.test.ts
            for existing_src in src/**/*.ts; do
              if [ -f "$existing_src" ]; then
                EDIT_FILES+=("$existing_src")
              fi
            done
            PROMPT="IMPORTANT: $SPEC_FILE, $OVERVIEW_FILE, and dependencies_and_connections.md are strictly READ-ONLY reference documents—do NOT edit them. All existing src/ modules are already loaded in chat. Follow $SPEC_FILE to wire the components together end-to-end (updating src/main.ts or other src/ files only if needed for integration) and CREATE the end-to-end integration test suite in tests/integration.test.ts (importing from 'vitest', using .js extensions on relative imports). Do not waste turns debating—implement the integration tests and any missing wiring immediately, and loop until npm run build and npm run test pass."
          else
            # Standard single-component TDD mode
            if [ -f "src/schemas.ts" ]; then
              READ_FLAGS+=(--read "src/schemas.ts")
            fi
            PROMPT="IMPORTANT: All files currently loaded as read-only ($OVERVIEW_FILE, dependencies_and_connections.md, src/schemas.ts, and $SPEC_FILE) are strictly REFERENCE DOCUMENTS—do NOT edit them. Read $SPEC_FILE to find the exact target file paths, then immediately CREATE the new TypeScript implementation file in src/ and its new Vitest test file in tests/ (importing from 'vitest', using .js extensions on relative imports like '../schemas.js'). Do not waste turns debating or exploring—create both target files right away and loop until npm run build and npm run test pass."
          fi
          shopt -u globstar nullglob

          CANDIDATES=(
            "google|gemini/gemini-3.8-flash"
            "google|gemini/gemini-3.5-flash-lite"
            "google|gemini/gemma-4-31b-it"
            "openrouter1|openrouter/particle-ai/particle-1:free"
            "openrouter1|openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
            "openrouter1|openrouter/nvidia/nemotron-3.5-super-vl:free"
            "openrouter1|openrouter/baidu/ernie-5.5-flash-preview:free"
            "openrouter2|openrouter/particle-ai/particle-1:free"
            "openrouter2|openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
            "openrouter2|openrouter/nvidia/nemotron-3.5-super-vl:free"
            "openrouter2|openrouter/baidu/ernie-5.5-flash-preview:free"
            "openrouter3|openrouter/particle-ai/particle-1:free"
            "openrouter3|openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
            "openrouter3|openrouter/nvidia/nemotron-3.5-super-vl:free"
            "openrouter3|openrouter/baidu/ernie-5.5-flash-preview:free"
            "kilo|openai/kilo-auto/free"
          )

          SUCCESS=false
          for ENTRY in "${CANDIDATES[@]}"; do
            PROVIDER="${ENTRY%%|*}"
            MODEL="${ENTRY#*|}"

            unset GEMINI_API_KEY OPENROUTER_API_KEY OPENAI_API_BASE OPENAI_API_KEY

            case "$PROVIDER" in
              google)
                [ -z "$GOOGLE_KEY" ] && continue
                export GEMINI_API_KEY="$GOOGLE_KEY"
                ;;
              openrouter1)
                [ -z "$OR_KEY_1" ] && continue
                export OPENROUTER_API_KEY="$OR_KEY_1"
                ;;
              openrouter2)
                [ -z "$OR_KEY_2" ] && continue
                export OPENROUTER_API_KEY="$OR_KEY_2"
                ;;
              openrouter3)
                [ -z "$OR_KEY_3" ] && continue
                export OPENROUTER_API_KEY="$OR_KEY_3"
                ;;
              kilo)
                [ -z "$KILO_KEY" ] && continue
                export OPENAI_API_BASE="https://kilo.ai"
                export OPENAI_API_KEY="$KILO_KEY"
                ;;
            esac

            git reset --hard "$CHECKPOINT_SHA" >/dev/null
            git clean -f >/dev/null

            echo "=================================================="
            echo "Attempting Aider [$PROVIDER] -> $MODEL"
            echo "=================================================="

            timeout 6m aider \
              --model "$MODEL" \
              --edit-format whole \
              --map-tokens 1024 \
              --no-detect-urls \
              --no-show-model-warnings \
              --yes \
              --auto-commits \
              "${READ_FLAGS[@]}" \
              "${EDIT_FILES[@]}" \
              --test-cmd "npm run build && npm run test" \
              --auto-test \
              --message "$PROMPT" \
              2>&1 | tee /tmp/aider.log | grep -viE "<(!DOCTYPE|html|head|body|script|style|svg|path|div|span|meta|link)" || true

            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: checkpoint aider progress" >/dev/null
            fi
            NEW_SHA=$(git rev-parse HEAD)

            # 1. Check if HEAD itself passes build + tests
            if [ "$NEW_SHA" != "$CHECKPOINT_SHA" ] \
               && npm run build >/dev/null 2>&1 \
               && npm run test >/dev/null 2>&1; then
              echo "Successfully completed Aider TDD loop via [$PROVIDER] $MODEL"
              SUCCESS=true
              break
            fi

            # 2. If HEAD failed or timed out mid-tweak, salvage any earlier passing commit made by this model!
            SALVAGED=false
            if [ "$NEW_SHA" != "$CHECKPOINT_SHA" ]; then
              for COMMIT in $(git rev-list "${CHECKPOINT_SHA}..${NEW_SHA}"); do
                git reset --hard "$COMMIT" >/dev/null
                git clean -f >/dev/null
                if npm run build >/dev/null 2>&1 && npm run test >/dev/null 2>&1; then
                  echo "::notice::[$PROVIDER] $MODEL timed out/stopped mid-edit, salvaged passing checkpoint ($COMMIT)!"
                  CHECKPOINT_SHA="$COMMIT"
                  SALVAGED=true
                  break
                fi
              done
            fi

            if [ "$SALVAGED" != "true" ]; then
              echo "::warning::[$PROVIDER] $MODEL failed, timed out, or left incomplete code. Rolling back to $CHECKPOINT_SHA..."
              git reset --hard "$CHECKPOINT_SHA" >/dev/null
              git clean -f >/dev/null
            fi
            sleep 3
          done

          if [ "$SUCCESS" != "true" ]; then
            git reset --hard "$CHECKPOINT_SHA" >/dev/null
            git clean -f >/dev/null
            echo "::error::All provider keys hit rate limits or failed. Wait a few minutes and re-run."
            exit 1
          fi

      - name: Verify & Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npm run test
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: implement $(basename ${{ github.event.inputs.spec_file }} .md)"
          fi
          if [ -z "$(git diff --name-only main HEAD -- src/ tests/)" ]; then
            echo "Error: No files created in src/ or tests/." && exit 1
          fi
          git push -u origin "$BRANCH_NAME"
          gh pr create \
            --title "feat: implement $(basename ${{ github.event.inputs.spec_file }} .md)" \
            --body "Automated TDD implementation of \`${{ github.event.inputs.spec_file }}\`." \
            --base main \
            --head "$BRANCH_NAME"
