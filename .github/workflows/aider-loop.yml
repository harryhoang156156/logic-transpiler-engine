name: Autonomous Aider TDD Loop

on:
  workflow_dispatch:
    inputs:
      spec_file:
        description: 'Target component specification file path (e.g., specs/schemas.md)'
        required: true
        type: string
      overview_file:
        description: 'Global system overview / rules file path'
        required: false
        default: 'architecture_overview.md'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          npm install
          pip install -q aider-chat

      - name: Create Feature Branch
        run: |
          git config --global user.name "Aider Cloud Agent"
          git config --global user.email "aider-bot@users.noreply.github.com"
          BRANCH_NAME="aider/$(basename ${{ github.event.inputs.spec_file }} .md)-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run Aider Self-Healing Loop (OpenRouter -> Kilo Auto)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KILO_KEY: ${{ secrets.KILO_API_KEY }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          LITELLM_NUM_RETRIES: '1'
          OVERVIEW_FILE: ${{ github.event.inputs.overview_file }}
          SPEC_FILE: ${{ github.event.inputs.spec_file }}
        run: |
          set -o pipefail

          CHECKPOINT_SHA=$(git rev-parse HEAD)
          PROMPT="Read $OVERVIEW_FILE, dependencies_and_connections.md, and $SPEC_FILE. Create the target TypeScript file in src/ and its Vitest suite in tests/ (importing from 'vitest'). Use .js extensions on relative imports (e.g. '../schemas.js'). Loop until npm run build and npm run test pass."

          READ_FLAGS=(--read "$SPEC_FILE")
          if [ -n "$OVERVIEW_FILE" ] && [ -f "$OVERVIEW_FILE" ]; then
            READ_FLAGS+=(--read "$OVERVIEW_FILE")
          fi
          if [ -f "dependencies_and_connections.md" ]; then
            READ_FLAGS+=(--read "dependencies_and_connections.md")
          fi
          if [ -f "src/schemas.ts" ]; then
            READ_FLAGS+=(--read "src/schemas.ts")
          fi

          CANDIDATES=(
            "openrouter|openrouter/particle-ai/particle-1:free"
            "openrouter|openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
            "openrouter|openrouter/nvidia/nemotron-3.5-super-vl:free"
            "openrouter|openrouter/baidu/ernie-5.5-flash-preview:free"
            "kilo|openai/kilo-auto/free"
          )

          SUCCESS=false
          for ENTRY in "${CANDIDATES[@]}"; do
            PROVIDER="${ENTRY%%|*}"
            MODEL="${ENTRY#*|}"

            if [ "$PROVIDER" == "openrouter" ] && [ -z "$OPENROUTER_API_KEY" ]; then
              echo "Skipping [$PROVIDER] $MODEL (OPENROUTER_API_KEY not set)"
              continue
            fi
            if [ "$PROVIDER" == "kilo" ] && [ -z "$KILO_KEY" ]; then
              echo "Skipping [$PROVIDER] $MODEL (KILO_API_KEY not set)"
              continue
            fi

            git reset --hard "$CHECKPOINT_SHA" >/dev/null
            git clean -f >/dev/null

            unset OPENAI_API_BASE
            unset OPENAI_API_KEY
            if [ "$PROVIDER" == "kilo" ]; then
              export OPENAI_API_BASE="https://kilo.ai"
              export OPENAI_API_KEY="$KILO_KEY"
            fi

            echo "=================================================="
            echo "Attempting Aider [$PROVIDER] -> $MODEL"
            echo "=================================================="

            aider \
              --model "$MODEL" \
              --edit-format whole \
              --map-tokens 1024 \
              --no-detect-urls \
              --no-show-model-warnings \
              --no-stream \
              --yes \
              --auto-commits \
              "${READ_FLAGS[@]}" \
              --test-cmd "npm run build && npm run test" \
              --auto-test \
              --message "$PROMPT" \
              2>&1 | tee /tmp/aider.log || true

            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: checkpoint aider progress" >/dev/null
            fi
            NEW_SHA=$(git rev-parse HEAD)

            if ! grep -qiE "rate limited|RateLimitError|429 Too Many Requests|Request too large|413|NotFoundError|model_not_found|No endpoints available|valid model ID|BadRequestError|400 Bad Request|AuthenticationError|401|API key.*not found|without an .* API key|No .* API key|Missing API key|ContextWindowExceededError|ServiceUnavailableError|503|APIConnectionError|InternalServerError|Timeout" /tmp/aider.log \
               && [ "$NEW_SHA" != "$CHECKPOINT_SHA" ] \
               && npm run build >/dev/null 2>&1 \
               && npm run test >/dev/null 2>&1; then
              echo "Successfully completed Aider TDD loop via [$PROVIDER] $MODEL"
              SUCCESS=true
              break
            fi

            if [ "$NEW_SHA" != "$CHECKPOINT_SHA" ] && npm run build >/dev/null 2>&1 && npm run test >/dev/null 2>&1; then
              echo "::notice::[$PROVIDER] $MODEL stopped early, but left a passing build & test checkpoint ($NEW_SHA). Keeping progress!"
              CHECKPOINT_SHA="$NEW_SHA"
            else
              echo "::warning::[$PROVIDER] $MODEL failed, hit rate limits, or left incomplete code. Rolling back to $CHECKPOINT_SHA..."
              git reset --hard "$CHECKPOINT_SHA" >/dev/null
              git clean -f >/dev/null
            fi
            sleep 5
          done

          if [ "$SUCCESS" != "true" ]; then
            git reset --hard "$CHECKPOINT_SHA" >/dev/null
            git clean -f >/dev/null
            echo "::error::All models hit rate limits or failed. Wait a few minutes and re-run."
            exit 1
          fi

      - name: Verify & Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npm run test
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: implement $(basename ${{ github.event.inputs.spec_file }} .md)"
          fi
          if [ -z "$(git diff --name-only main HEAD -- src/ tests/)" ]; then
            echo "Error: No files created in src/ or tests/." && exit 1
          fi
          git push -u origin "$BRANCH_NAME"
          gh pr create \
            --title "feat: implement $(basename ${{ github.event.inputs.spec_file }} .md)" \
            --body "Automated TDD implementation of \`${{ github.event.inputs.spec_file }}\`." \
            --base main \
            --head "$BRANCH_NAME"
