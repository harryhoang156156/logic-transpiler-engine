name: Autonomous Aider TDD Loop

on:
  workflow_dispatch:
    inputs:
      spec_file:
        description: 'Target component specification file path (e.g., specs/schemas.md)'
        required: true
        type: string
      overview_file:
        description: 'Global system overview / rules file path'
        required: false
        default: 'architecture_overview.md'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python for Aider
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node & Aider Dependencies
        run: |
          npm install
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Create Feature Branch
        run: |
          git config --global user.name "Aider Cloud Agent"
          git config --global user.email "aider-bot@://github.com"
          BRANCH_NAME="aider/$(basename ${{ github.event.inputs.spec_file }} .md)-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run Aider Self-Healing Test & Build Loop
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          MODULE_NAME=$(basename "${{ github.event.inputs.spec_file }}" .md)
          if [ "$MODULE_NAME" = "ai_client" ] || [ "$MODULE_NAME" = "prompts" ]; then
            SRC_FILE="src/client/${MODULE_NAME}.ts"
          elif [ "$MODULE_NAME" = "parser" ] || [ "$MODULE_NAME" = "gap_analyzer" ]; then
            SRC_FILE="src/ingestion/${MODULE_NAME}.ts"
          elif [ "$MODULE_NAME" = "ts_emitter" ] || [ "$MODULE_NAME" = "atomic_merger" ]; then
            SRC_FILE="src/compiler/${MODULE_NAME}.ts"
          elif [ "$MODULE_NAME" = "compiler_guard" ]; then
            SRC_FILE="src/verification/${MODULE_NAME}.ts"
          else
            SRC_FILE="src/${MODULE_NAME}.ts"
          fi
          TEST_FILE="tests/${MODULE_NAME}.test.ts"

          mkdir -p "$(dirname "$SRC_FILE")" tests

          aider \
            --model nvidia_nim/meta/llama-3.3-70b-instruct \
            --no-show-model-warnings \
            --yes \
            --auto-commits \
            --read "${{ github.event.inputs.overview_file }}" \
            --read "${{ github.event.inputs.spec_file }}" \
            --file "$SRC_FILE" \
            --file "$TEST_FILE" \
            --test-cmd "npm run build && npm run test" \
            --auto-test \
            --message "Strictly adhere to all global architecture rules in ${{ github.event.inputs.overview_file }}. Implement the exact module specified in ${{ github.event.inputs.spec_file }} inside $SRC_FILE, and write its complete Vitest unit test suite inside $TEST_FILE importing from 'vitest'. Loop until both npm run build and npm run test pass with zero errors."

      - name: Push Branch & Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: save remaining Aider generated files"
          fi
          if [ -z "$(git diff --name-only main HEAD -- src/ tests/)" ]; then
            echo "Error: Aider did not generate any files in src/ or tests/. Check the Aider step logs above."
            exit 1
          fi
          git push -u origin "$BRANCH_NAME"
          gh pr create \
            --title "feat: implement $(basename ${{ github.event.inputs.spec_file }} .md)" \
            --body "Automated TDD implementation of \`${{ github.event.inputs.spec_file }}\` verified via \`npm run build && npm run test\`." \
            --base main \
            --head "$BRANCH_NAME"
