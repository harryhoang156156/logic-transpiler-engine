name: Autonomous Aider TDD Loop

on:
  workflow_dispatch:
    inputs:
      spec_file:
        description: 'Target component specification file path (e.g., specs/schemas.md)'
        required: true
        type: string
      overview_file:
        description: 'Global system overview / rules file path'
        required: false
        default: 'architecture_overview.md'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js & Python
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          npm install
          pip install -q aider-chat

      - name: Create Feature Branch
        run: |
          git config --global user.name "Aider Cloud Agent"
          git config --global user.email "aider-bot@users.noreply.github.com"
          BRANCH_NAME="aider/$(basename ${{ github.event.inputs.spec_file }} .md)-${{ github.run_id }}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run Aider Self-Healing Loop (Fast Multi-Key Cascade)
        env:
          GOOGLE_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OR_KEY_1: ${{ secrets.OPENROUTER_API_KEY }}
          OR_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OR_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          KILO_KEY: ${{ secrets.KILO_API_KEY }}
          HF_HUB_DISABLE_TELEMETRY: '1'
          LITELLM_NUM_RETRIES: '1'
          OVERVIEW_FILE: ${{ github.event.inputs.overview_file }}
          SPEC_FILE: ${{ github.event.inputs.spec_file }}
        run: |
          set -o pipefail

          INITIAL_SHA=$(git rev-parse HEAD)
          CHECKPOINT_SHA="$INITIAL_SHA"

          BASE_READ_FLAGS=(--read "$SPEC_FILE")
          if [ -n "$OVERVIEW_FILE" ] && [ -f "$OVERVIEW_FILE" ]; then
            BASE_READ_FLAGS+=(--read "$OVERVIEW_FILE")
          fi
          if [ -f "dependencies_and_connections.md" ]; then
            BASE_READ_FLAGS+=(--read "dependencies_and_connections.md")
          fi
          if [[ "$SPEC_FILE" != *integration* ]] && [ -f "src/schemas.ts" ]; then
            BASE_READ_FLAGS+=(--read "src/schemas.ts")
          fi

          # Lean 6-entry cascade (best model per key) -> max ~30 mins worst-case instead of 1+ hour
          CANDIDATES=(
            "google|gemini/gemini-3.8-flash"
            "openrouter1|openrouter/particle-ai/particle-1:free"
            "openrouter2|openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
            "openrouter3|openrouter/particle-ai/particle-1:free"
            "google|gemini/gemini-3.5-flash-lite"
            "kilo|openai/kilo-auto/free"
          )

          SUCCESS=false
          for ENTRY in "${CANDIDATES[@]}"; do
            PROVIDER="${ENTRY%%|*}"
            MODEL="${ENTRY#*|}"

            unset GEMINI_API_KEY OPENROUTER_API_KEY OPENAI_API_BASE OPENAI_API_KEY

            case "$PROVIDER" in
              google)
                [ -z "$GOOGLE_KEY" ] && continue
                export GEMINI_API_KEY="$GOOGLE_KEY"
                ;;
              openrouter1)
                [ -z "$OR_KEY_1" ] && continue
                export OPENROUTER_API_KEY="$OR_KEY_1"
                ;;
              openrouter2)
                [ -z "$OR_KEY_2" ] && continue
                export OPENROUTER_API_KEY="$OR_KEY_2"
                ;;
              openrouter3)
                [ -z "$OR_KEY_3" ] && continue
                export OPENROUTER_API_KEY="$OR_KEY_3"
                ;;
              kilo)
                [ -z "$KILO_KEY" ] && continue
                export OPENAI_API_BASE="https://kilo.ai"
                export OPENAI_API_KEY="$KILO_KEY"
                ;;
            esac

            git reset --hard "$CHECKPOINT_SHA" >/dev/null
            git clean -f >/dev/null

            shopt -s globstar nullglob
            EDIT_FILES=()
            if [[ "$SPEC_FILE" == *integration* ]]; then
              for existing_src in src/**/*.ts; do
                [ -f "$existing_src" ] && EDIT_FILES+=("$existing_src")
              done
            fi
            CHECKPOINT_FILES=()
            if [ "$CHECKPOINT_SHA" != "$INITIAL_SHA" ]; then
              while IFS= read -r cf; do
                if [ -n "$cf" ] && [ -f "$cf" ]; then
                  CHECKPOINT_FILES+=("$cf")
                  EDIT_FILES+=("$cf")
                fi
              done < <(git diff --name-only "$INITIAL_SHA" "$CHECKPOINT_SHA" -- src/ tests/)
            fi
            shopt -u globstar nullglob

            RESUME_NOTE=""
            if [ ${#CHECKPOINT_FILES[@]} -gt 0 ]; then
              RESUME_NOTE="PROGRESS CHECKPOINT LOADED: A previous model already created and compiled these files (${CHECKPOINT_FILES[*]}). DO NOT rewrite them from scratch—inspect them in chat and finish any remaining code or failing Vitest tests."
            fi

            if [[ "$SPEC_FILE" == *integration* ]]; then
              PROMPT="IMPORTANT: $SPEC_FILE, $OVERVIEW_FILE, and dependencies_and_connections.md are strictly READ-ONLY reference documents—do NOT edit them. $RESUME_NOTE Follow $SPEC_FILE to wire the components together end-to-end (updating src/main.ts or other src/ files only if needed) and ensure tests/integration.test.ts passes completely (importing from 'vitest', using .js extensions on relative imports). Loop until npm run build and npm run test pass."
            else
              PROMPT="IMPORTANT: All files loaded as read-only ($OVERVIEW_FILE, dependencies_and_connections.md, src/schemas.ts, and $SPEC_FILE) are strictly REFERENCE DOCUMENTS—do NOT edit them. $RESUME_NOTE Read $SPEC_FILE to find the exact target file paths in src/ and tests/ (importing from 'vitest', using .js extensions on relative imports like '../schemas.js'). Loop until npm run build and npm run test pass."
            fi

            echo "=================================================="
            echo "Attempting Aider [$PROVIDER] -> $MODEL (Checkpoint: ${CHECKPOINT_SHA:0:7})"
            echo "=================================================="

            timeout 5m aider \
              --model "$MODEL" \
              --edit-format whole \
              --map-tokens 1024 \
              --chat-history-file /tmp/aider-tdd-history.md \
              --no-detect-urls \
              --no-show-model-warnings \
              --yes \
              --auto-commits \
              "${BASE_READ_FLAGS[@]}" \
              "${EDIT_FILES[@]}" \
              --test-cmd "npm run build && npm run test" \
              --auto-test \
              --message "$PROMPT" \
              2>&1 | tee /tmp/aider.log | grep -viE "<(!DOCTYPE|html|head|body|script|style|svg|path|div|span|meta|link)" || true

            HAS_CHANGES=false
            if [ "$(git rev-parse HEAD)" != "$CHECKPOINT_SHA" ] || ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              HAS_CHANGES=true
            fi

            if [ "$HAS_CHANGES" == "true" ]; then
              # Tier 1: Both TypeScript build AND all Vitest tests pass -> Done!
              if npm run build >/dev/null 2>&1 && npm run test >/dev/null 2>&1; then
                git add -A
                if ! git diff --cached --quiet; then
                  git commit -m "chore: checkpoint passing build and tests" >/dev/null
                fi
                CHECKPOINT_SHA=$(git rev-parse HEAD)
                echo "Successfully completed Aider TDD loop via [$PROVIDER] $MODEL"
                SUCCESS=true
                break
              fi

              # Tier 2a: Full repo compiles cleanly (even if Vitest assertions still fail) -> Save progress!
              if npm run build >/dev/null 2>&1; then
                git add -A
                if ! git diff --cached --quiet; then
                  git commit -m "chore: checkpoint compiling build progress" >/dev/null
                fi
                CHECKPOINT_SHA=$(git rev-parse HEAD)
                echo "::notice::[$PROVIDER] $MODEL saved compiling TypeScript checkpoint (${CHECKPOINT_SHA:0:7}) for next model!"
              else
                # Tier 2b: Check if src/ itself compiles cleanly when broken test files are reverted
                git checkout "$CHECKPOINT_SHA" -- tests/ 2>/dev/null || true
                git clean -f tests/ 2>/dev/null || true
                if [ -n "$(git status --porcelain src/)" ] && npm run build >/dev/null 2>&1; then
                  git add src/
                  git commit -m "chore: checkpoint compiling src/ implementation" >/dev/null
                  CHECKPOINT_SHA=$(git rev-parse HEAD)
                  echo "::notice::[$PROVIDER] $MODEL saved compiling src/ checkpoint (${CHECKPOINT_SHA:0:7}); next model will write tests!"
                else
                  echo "::warning::[$PROVIDER] $MODEL left broken TypeScript. Rolling back to ${CHECKPOINT_SHA:0:7}..."
                  git reset --hard "$CHECKPOINT_SHA" >/dev/null
                  git clean -f >/dev/null
                fi
              fi
            else
              echo "::warning::[$PROVIDER] $MODEL made no file changes (rate-limited or timed out)."
            fi
            sleep 2
          done

          if [ "$SUCCESS" != "true" ]; then
            git reset --hard "$CHECKPOINT_SHA" >/dev/null
            git clean -f >/dev/null
            echo "::error::All provider keys hit rate limits or failed. Wait for quota reset and re-run."
            exit 1
          fi

      - name: Verify & Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          npm run test
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: implement $(basename ${{ github.event.inputs.spec_file }} .md)"
          fi
          if [ -z "$(git diff --name-only main HEAD -- src/ tests/)" ]; then
            echo "Error: No files created in src/ or tests/." && exit 1
          fi
          git push -u origin "$BRANCH_NAME"
          gh pr create \
            --title "feat: implement $(basename ${{ github.event.inputs.spec_file }} .md)" \
            --body "Automated TDD implementation of \`${{ github.event.inputs.spec_file }}\`." \
            --base main \
            --head "$BRANCH_NAME"
